name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 -cover ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - if: runner.os == 'Windows'
        run: ./scripts/check.ps1
      - if: runner.os == 'Linux'
        run: |
          go test -race ./...
          go test ./internal/discovery -run '^$' -fuzz '^FuzzProxyConfigurationParsers$' -fuzztime 10s -parallel 2
          go test ./internal/storage -run '^$' -fuzz '^FuzzBlockDecoder$' -fuzztime 10s -parallel 2
          go test ./internal/storage -run '^$' -fuzz '^FuzzMetricWindowDecoder$' -fuzztime 10s -parallel 2
          HOSTOPS_STORAGE_BENCH=1 go test ./internal/storage -run '^TestFullDayLosslessStorageComparison$' -count=1 -v
          HOSTOPS_STORAGE_BENCH=1 go test ./internal/storage -run '^TestTieredMetricStorageComparison$' -count=1 -v
          bash scripts/build-bundles.sh
  systemd-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash scripts/linux-lab.sh
